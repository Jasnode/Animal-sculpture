<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>动物塑测试 · 历史记录</title>
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/gh/88lin/picx-images-hosting@master/cdn/styles.css" integrity="sha384-d1zkSpiOwULrTrPSxDUKjSmM5iPYnfY6gP7JM5b7qNm58JtOyTESVqAlg5GMWzOF" crossorigin="anonymous">
    <style>
      .history-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px;
        margin-top: 48px;
        margin-bottom: 48px;
        border-radius: 28px;
        background:
          radial-gradient(circle at top left, rgba(102,126,234,0.18), transparent 55%),
          radial-gradient(circle at bottom right, rgba(244,114,182,0.18), transparent 55%),
          #ffffff;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.18);
        border: 2px solid rgba(138, 43, 226, 0.12);
        position: relative;
        overflow: hidden;
        z-index: 0;
      }

      .history-container::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent 60%);
        pointer-events: none;
        z-index: -1;
      }

      .history-header {
        position: relative;
        text-align: center;
        margin-bottom: 32px;
      }

      .history-title {
        font-size: 30px;
        font-weight: 900;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #667eea 0%, #7c3aed 40%, #f97373 80%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .history-subtitle {
        font-size: 15px;
        color: #6b7280;
      }

      .history-actions-top {
        position: relative;
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 24px;
        flex-wrap: wrap;
      }

      .history-top-btn {
        padding: 10px 20px;
        border-radius: 999px;
        border: none;
        font-size: 15px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
      }

      .history-top-btn::before {
        content: '';
        position: absolute;
        left: -100%;
        top: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: left 0.5s ease;
      }

      .history-top-btn:hover::before {
        left: 100%;
      }

      .history-top-btn.primary {
        background: linear-gradient(135deg, #667eea, #7c3aed);
        color: #ffffff;
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.5);
      }

      .history-top-btn.primary:hover {
        transform: translateY(-2px);
      }

      .history-top-btn.secondary {
        background: rgba(255, 255, 255, 0.9);
        color: #374151;
        border: 1px solid rgba(148, 163, 184, 0.5);
        box-shadow: 0 8px 18px rgba(148, 163, 184, 0.35);
      }

      .history-top-btn.secondary:hover {
        transform: translateY(-2px);
        border-color: rgba(129, 140, 248, 0.8);
      }

      .history-section-title {
        position: relative;
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 18px;
        color: #1f2937;
        padding-left: 10px;
      }

      .history-section-title::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translate(-8px, -50%);
        width: 4px;
        height: 18px;
        border-radius: 999px;
        background: linear-gradient(180deg, #8b5cf6, #ec4899);
      }

      .history-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .history-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px;
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(249,250,251,1) 0%, rgba(243,244,246,1) 100%);
        border: 1px solid rgba(148, 163, 184, 0.5);
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18);
        position: relative;
        overflow: hidden;
      }

      .history-card::before {
        content: '';
        position: absolute;
        right: -40px;
        top: -40px;
        width: 120px;
        height: 120px;
        background: radial-gradient(circle at center, rgba(129,140,248,0.25), transparent 70%);
        opacity: 0.8;
        pointer-events: none;
      }

      .history-main {
        display: flex;
        align-items: center;
        gap: 16px;
        position: relative;
        z-index: 1;
      }

      .history-avatar {
        width: 56px;
        height: 56px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        background: radial-gradient(circle at 30% 10%, #ffffff, #e5e7eb);
        box-shadow: 0 6px 18px rgba(55, 65, 81, 0.35);
        flex-shrink: 0;
      }

      .history-meta {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .history-title-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
      }

      .history-animal-name {
        font-size: 18px;
        font-weight: 800;
        color: #111827;
      }

      .history-animal-type {
        font-size: 13px;
        font-weight: 600;
        padding: 4px 9px;
        border-radius: 999px;
        background: linear-gradient(135deg, #eef2ff, #fdf2ff);
        color: #4f46e5;
        border: 1px solid rgba(129, 140, 248, 0.8);
      }

      .history-time {
        font-size: 13px;
        color: #6b7280;
      }

      .history-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .history-tag {
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(243, 244, 246, 0.9);
        color: #4b5563;
      }

      .history-actions {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end;
      }

      .history-button {
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        border: none;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .history-button.primary {
        background: linear-gradient(135deg, #667eea, #7c3aed);
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(79, 70, 229, 0.5);
      }

      .history-button.primary:hover {
        transform: translateY(-2px);
      }

      .history-button.secondary {
        background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        color: #374151;
        box-shadow: 0 4px 10px rgba(148, 163, 184, 0.4);
        border: 1px solid rgba(148, 163, 184, 0.8);
      }

      .history-button.secondary:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #e5e7eb 0%, #d1d5db 100%);
      }

      .history-empty {
        text-align: center;
        padding: 40px 16px;
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(239,246,255,0.9), rgba(255,247,237,0.9));
        border: 1px dashed rgba(148, 163, 184, 0.8);
        margin-top: 12px;
      }

      .history-empty-emoji {
        font-size: 40px;
        margin-bottom: 8px;
      }

      .history-empty-text-strong {
        font-size: 18px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 4px;
      }

      .history-empty div {
        color: #6b7280;
      }

      /* 答题记录区域（PC 端） */
      .answer-detail {
        margin-top: 18px;
      }

      .answer-detail-content {
        min-height: 70vh;
        max-height: none;
        overflow: visible;
        border-radius: 16px;
        background: #ffffff;
        padding: 16px;
        border: 1px solid rgba(148,163,184,0.4);
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.12);
      }

      @media (max-width: 768px) {
        .history-container {
          margin: 8px 4px;
          padding: 20px;
          border-radius: 22px;
        }

        .history-header {
          margin-bottom: 24px;
        }

        .history-actions-top {
          justify-content: center;
        }

        .history-top-btn {
          width: 100%;
          justify-content: center;
        }

        .history-list {
          gap: 12px;
        }

        .history-card {
          flex-direction: column;
          align-items: flex-start;
          padding: 14px 14px;
          border-radius: 18px;
          gap: 10px;
        }

        .history-main {
          width: 100%;
          gap: 10px;
        }

        .history-actions {
          width: 100%;
          align-items: stretch;
          flex-direction: row;
          flex-wrap: wrap;
          gap: 8px;
          margin-top: 4px;
        }

        .history-button {
          flex: 1;
          justify-content: center;
          min-width: 0;
          padding: 8px 10px;
        }

        .answer-detail {
          margin-top: 24px;
        }

        .answer-detail-content {
          padding: 12px 12px 16px;
          border-radius: 14px;
          min-height: 80vh;
        }
      }

      @media (max-width: 480px) {
        .history-container {
          padding: 16px;
          margin: 8px 6px;
          border-radius: 20px;
        }

        .history-card {
          padding: 12px 12px;
          border-radius: 16px;
        }

        .answer-detail-content {
          padding: 10px 10px 14px;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <a href="/dw" class="nav__brand">
        <span class="brand__logo">🦄</span>
        <div class="brand__text">
          <div class="brand__cn">动物塑测试</div>
          <div class="brand__en">Animal Personality Test</div>
        </div>
      </a>
      <button class="nav__toggle" id="nav-toggle" aria-label="打开菜单">☰</button>
      <nav class="nav__links" id="nav-links">
        <a href="index.html" class="nav__link"><span>🏠</span> 首页</a>
        <a href="quiz.html" class="nav__link"><span>📊</span> 重新测评</a>
        <a href="https://home-gnwr20uh.maozi.io/fireworks/1.html" class="nav__link" target="_blank" rel="noopener noreferrer"><span>🩷</span>赞赏支持</a>
        <a href="https://blog.nuaa.tech" class="nav__link" target="_blank" rel="noopener noreferrer"><span>✍</span>个人博客</a>
        <a href="https://home-gnwr20uh.maozi.io" class="nav__link" target="_blank" rel="noopener noreferrer"><span>🔗</span>茉灵导航</a>
        <a href="https://home-gnwr20uh.maozi.io/gzh/index.html" class="nav__link" target="_blank" rel="noopener noreferrer"><span>📩</span>微信公众号</a>
      </nav>
    </header>

    <main class="main">
      <div class="history-container">
        <div class="history-header">
          <h1 class="history-title">历史记录中心</h1>
          <p class="history-subtitle">这里保存了你每一次的动物塑测试结果，可以随时回顾和对比。</p>

          <div class="history-actions-top">
            <a href="result.html" class="history-top-btn primary">
              <span>查看最近一次完整结果</span>
            </a>
          </div>
        </div>

        <section id="history-section">
          <h2 class="history-section-title">测评历史记录</h2>
          <div id="history-empty" class="history-empty" style="display: none;">
            <div class="history-empty-emoji">🕊️</div>
            <div class="history-empty-text-strong">还没有历史记录</div>
            <div>完成一次测评后，这里会自动为你保存答题与结果记录。</div>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
        <section id="answer-detail" class="answer-detail" style="display: none;">
          <h2 id="answer-detail-title" class="history-section-title">答题记录</h2>
          <div id="answer-detail-content" class="answer-detail-content"></div>
        </section>
      </div>
    </main>

    <script src="mobile-nav.js"></script>
    <script>
      let allQuestions = [];
      let historyData = [];
      async function loadQuestionsForHistory() {
      try {
        const resp = await fetch('questions.json');
        if (!resp.ok) throw new Error('题目加载失败');
        allQuestions = await resp.json();
      } catch (e) {
        console.warn('history 页面加载 questions.json 失败：', e);
        allQuestions = [];
      }
    }

    function showAnswerDetail(historyId) {
      const detailSection = document.getElementById('answer-detail');
      const titleEl = document.getElementById('answer-detail-title');
      const contentEl = document.getElementById('answer-detail-content');

      const item = historyData.find(h => h.id === historyId);
      if (!item) {
        titleEl.textContent = '答题记录未找到';
        contentEl.innerHTML = '<p style="padding: 16px; color:#6b7280;">无法找到对应的历史记录。</p>';
        detailSection.style.display = 'block';
        detailSection.scrollIntoView({ behavior: 'smooth' });
        return;
      }

      if (!allQuestions || allQuestions.length === 0) {
        titleEl.textContent = '答题记录';
        contentEl.innerHTML = '<p style="padding: 16px; color:#6b7280;">题目数据加载失败，暂时无法展示详细答题记录。</p>';
        detailSection.style.display = 'block';
        detailSection.scrollIntoView({ behavior: 'smooth' });
        return;
      }

      titleEl.textContent = `${item.animalEmoji || '🐾'} ${item.animalName || ''} 的答题记录`;

      const answerMap = item.answers || {};
      const total = allQuestions.length;

      const htmlParts = allQuestions.map((q, idx) => {
        const userVal = answerMap[q.id];
        const userChoice = q.options.find(o => o.value === userVal);

        let optionsHtml = q.options.map(o => {
          const isChosen = o.value === userVal;
          return `
            <div style="
              padding:6px 10px;
              border-radius:10px;
              margin-bottom:4px;
              ${isChosen ? 'background:rgba(129,140,248,0.12); border:1px solid rgba(129,140,248,0.8); font-weight:600;' : 'background:#f9fafb; border:1px solid #e5e7eb;'}
            ">
              <strong style="margin-right:4px;">${o.value}.</strong>${o.text}
              ${isChosen ? '<span style="font-size:16px; color:#4f46e5;">（√）</span>' : ''}
            </div>`;
        }).join('');

        if (!userVal) {
          optionsHtml += `<div style="margin-top:4px; font-size:12px; color:#f97316;">本题未作答</div>`;
        }

        return `
          <div style="padding:10px 12px 12px; border-bottom:1px dashed #e5e7eb;">
            <div style="font-size:14px; color:#6b7280; margin-bottom:4px;">第 ${idx + 1} / ${total} 题</div>
            <div style="font-size:15px; font-weight:600; color:#111827; margin-bottom:6px;">${q.question}</div>
            ${optionsHtml}
          </div>
        `;
      });

      contentEl.innerHTML = htmlParts.join('');
      detailSection.style.display = 'block';
      detailSection.scrollIntoView({ behavior: 'smooth' });
    }
      function formatDate(iso) {
        try {
          const d = new Date(iso);
          if (isNaN(d.getTime())) return '时间未知';
          const pad = n => n.toString().padStart(2, '0');
          return d.getFullYear() + '-' +
                 pad(d.getMonth() + 1) + '-' +
                 pad(d.getDate()) + ' ' +
                 pad(d.getHours()) + ':' +
                 pad(d.getMinutes());
        } catch (e) {
          return '时间未知';
        }
      }

      function getTopDimensionName(tScores) {
        if (!tScores) return '数据不足';
        const mapNames = {
          DOM: '支配性 DOM',
          STR: '进取性 STR',
          COM: '社交外向 COM',
          SOL: '独立性 SOL',
          AGI: '敏捷度 AGI',
          SEC: '安全感 SEC',
          AES: '审美感 AES'
        };
        let bestKey = null;
        let bestVal = -Infinity;
        Object.entries(tScores).forEach(([k, v]) => {
          if (typeof v === 'number' && v > bestVal) {
            bestVal = v;
            bestKey = k;
          }
        });
        return bestKey ? mapNames[bestKey] || bestKey : '综合型';
      }

      function renderHistory() {
        const listEl = document.getElementById('history-list');
        const emptyEl = document.getElementById('history-empty');

        let history = [];
        try {
          const raw = localStorage.getItem('quizHistory');
          if (raw) {
            history = JSON.parse(raw);
          }
        } catch (e) {
          console.warn('解析历史记录失败:', e);
        }

        historyData = history;

        if (!history || history.length === 0) {
          emptyEl.style.display = 'block';
          listEl.style.display = 'none';
          return;
        }

        emptyEl.style.display = 'none';
        listEl.style.display = 'flex';
        listEl.innerHTML = '';

        history.forEach(item => {
          const card = document.createElement('div');
          card.className = 'history-card';

          const createdText = formatDate(item.createdAt || item.id);
          const topDim = getTopDimensionName(item.tScores);
          const answerCount = item.answers ? Object.keys(item.answers).length : 0;

          card.innerHTML = `
            <div class="history-main">
              <div class="history-avatar">${item.animalEmoji || '🐾'}</div>
              <div class="history-meta">
                <div class="history-title-row">
                  <span class="history-animal-name">${item.animalName || '未知动物'}</span>
                  <span class="history-animal-type">${item.animalType || item.typeCombined || '个性探索型'}</span>
                </div>
                <div class="history-time">测评时间：${createdText}</div>
                <div class="history-tags">
                  <span class="history-tag">维度高点：${topDim}</span>
                  <span class="history-tag">答题数量：${answerCount} / 60</span>
                </div>
              </div>
            </div>
            <div class="history-actions">
            <a class="history-button primary history-answer-link" href="javascript:void(0)" data-id="${item.id}">
              <span>📖</span>
              <span>答题记录</span>
            </a>
            <a class="history-button primary" href="result.html?historyId=${encodeURIComponent(item.id)}">
              <span>📊</span>
              <span>查看结果</span>
            </a>
          </div>
          `;

          listEl.appendChild(card);
          // 绑定“答题记录”按钮点击事件
          const answerLink = card.querySelector('.history-answer-link');
          if (answerLink) {
            answerLink.addEventListener('click', function () {
              showAnswerDetail(item.id);
            });
          }
          const detailBtn = card.querySelector('.history-button.secondary');
          if (detailBtn) {
            detailBtn.addEventListener('click', function () {
              showAnswerDetail(item.id);
            });
          }
        });
      }

      document.addEventListener('DOMContentLoaded', async function () {
        await loadQuestionsForHistory();
        renderHistory();
        checkUnfinishedQuiz();

        const toListBtn = document.getElementById('to-list-button');
        if (toListBtn) {
          toListBtn.addEventListener('click', function () {
            const section = document.getElementById('history-section');
            if (section) {
              section.scrollIntoView({ behavior: 'smooth' });
            }
          });
        }
      });
    </script>
  </body>
</html>
